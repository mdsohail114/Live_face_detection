{% extends "base.html" %}
{% block title %}Login — AI Emergency Safety System{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm auth-card">
            <div class="card-body p-4">
                <h1 class="h4 mb-2">Sign in</h1>
                <p class="text-muted mb-4">Access your emergency dashboard and SOS controls.</p>
                <form method="post" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" type="password" id="password" name="password" required>
                    </div>
                    <button class="btn btn-danger w-100" type="submit">Login</button>
                </form>
                <p class="mt-3 mb-0 small">New user? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
